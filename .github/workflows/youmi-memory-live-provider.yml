name: Verify Youmi real chat provider
on:
  push:
    paths:
      - 'scripts/ci/verify_youmi_live_provider.py'
      - '.github/workflows/youmi-memory-live-provider.yml'
  pull_request:
    paths:
      - 'scripts/ci/verify_youmi_live_provider.py'
      - '.github/workflows/youmi-memory-live-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check probe syntax without credentials or provider calls
        run: python -m py_compile scripts/ci/verify_youmi_live_provider.py
  live:
    if: github.event_name == 'workflow_dispatch'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: One real request with dedicated test credentials
        env:
          MIA_TEST_LLM_API_KEY: ${{ secrets.MIA_TEST_LLM_API_KEY }}
          MIA_TEST_LLM_BASE_URL: ${{ secrets.MIA_TEST_LLM_BASE_URL }}
          MIA_TEST_LLM_MODEL: ${{ secrets.MIA_TEST_LLM_MODEL }}
          MIA_TEST_REPORT_PATH: ${{ runner.temp }}/mia-live-provider.json
        run: python scripts/ci/verify_youmi_live_provider.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Youmi-real-provider-${{ github.sha }}
          path: ${{ runner.temp }}/mia-live-provider.json
          if-no-files-found: warn
