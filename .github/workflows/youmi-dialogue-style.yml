name: Verify Youmi dialogue style
on:
  push:
    paths:
      - 'scripts/ci/verify_youmi_dialogue_style.py'
      - '.github/workflows/youmi-dialogue-style.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/ci/verify_youmi_dialogue_style.py
  live:
    if: github.event_name == 'workflow_dispatch'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 openai==2.8.1 aiohttp==3.14.3
      - name: Continuous ordinary dialogue, addressing, and speaker attribution
        env:
          MIA_TEST_LLM_API_KEY: ${{ secrets.MIA_TEST_LLM_API_KEY }}
          MIA_TEST_LLM_BASE_URL: ${{ secrets.MIA_TEST_LLM_BASE_URL }}
          MIA_TEST_LLM_MODEL: glm-4-flash-250414
          MIA_CHARACTER_REPORT: ${{ runner.temp }}/mia-dialogue-style.json
        run: python scripts/ci/verify_youmi_dialogue_style.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Youmi-dialogue-style-${{ github.sha }}
          path: ${{ runner.temp }}/mia-dialogue-style.json
          if-no-files-found: warn
