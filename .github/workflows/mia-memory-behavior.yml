name: Verify Mia composed real behavior
on:
  push:
    paths:
      - 'scripts/ci/verify_mia_behavior.py'
      - 'scripts/ci/mia_model_comparison.py'
      - 'scripts/ci/mia_behavior_tools.py'
      - 'scripts/ci/mia_behavior_retrieval.py'
      - 'scripts/ci/mia_behavior_inflight.py'
      - 'scripts/ci/mia_behavior_recovery.py'
      - 'scripts/ci/mia_behavior_growth.py'
      - 'scripts/ci/mia_behavior_scope.py'
      - 'scripts/ci/mia_behavior_faults.py'
      - 'scripts/ci/mia_behavior_runtime.py'
      - 'server/tests/fixtures/persona_memory_shutdown_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_faults_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_scope_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_growth_p22_v1.json'
      - 'server/companion/manager_tests/MiaBehaviorIntegrationTest.java'
      - 'server/tests/fixtures/persona_memory_behavior_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_tools_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_correction_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_natural_correction_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_retrieval_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_retrieval_p22_v2.json'
      - 'server/tests/fixtures/persona_memory_recovery_p22_v1.json'
      - '.github/workflows/mia-memory-behavior.yml'
  pull_request:
    paths:
      - 'scripts/ci/verify_mia_behavior.py'
      - 'scripts/ci/mia_model_comparison.py'
      - 'scripts/ci/mia_behavior_tools.py'
      - 'scripts/ci/mia_behavior_retrieval.py'
      - 'scripts/ci/mia_behavior_inflight.py'
      - 'scripts/ci/mia_behavior_recovery.py'
      - 'scripts/ci/mia_behavior_growth.py'
      - 'scripts/ci/mia_behavior_scope.py'
      - 'scripts/ci/mia_behavior_faults.py'
      - 'scripts/ci/mia_behavior_runtime.py'
      - 'server/tests/fixtures/persona_memory_shutdown_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_faults_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_scope_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_growth_p22_v1.json'
      - 'server/companion/manager_tests/MiaBehaviorIntegrationTest.java'
      - 'server/tests/fixtures/persona_memory_behavior_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_tools_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_correction_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_natural_correction_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_retrieval_p22_v1.json'
      - 'server/tests/fixtures/persona_memory_retrieval_p22_v2.json'
      - 'server/tests/fixtures/persona_memory_recovery_p22_v1.json'
      - '.github/workflows/mia-memory-behavior.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Real continuity, correction, retrieval or tool/context scenarios with three isolated users
        type: choice
        options: [continuity, growth, scope, faults, shutdown, tools, correction, natural_correction, retrieval, retrieval_holdout, inflight, recovery]
        default: continuity
      test_model:
        description: Explicit isolated comparison only; configured preserves existing test model
        type: choice
        options: [configured, glm-5.3-flash, glm-5.3-flashx]
        default: configured
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m py_compile scripts/ci/verify_mia_behavior.py
      - run: python -m py_compile scripts/ci/mia_model_comparison.py
      - run: python -m py_compile scripts/ci/mia_behavior_tools.py
      - run: python -m py_compile scripts/ci/mia_behavior_retrieval.py
      - run: python -m py_compile scripts/ci/mia_behavior_inflight.py
      - run: python -m py_compile scripts/ci/mia_behavior_recovery.py
      - run: python -m py_compile scripts/ci/mia_behavior_growth.py
      - run: python -m py_compile scripts/ci/mia_behavior_scope.py
      - run: python -m py_compile scripts/ci/mia_behavior_faults.py
      - run: python -m py_compile scripts/ci/mia_behavior_runtime.py
      - run: python -m json.tool server/tests/fixtures/persona_memory_shutdown_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_faults_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_scope_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_growth_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_behavior_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_tools_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_correction_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_natural_correction_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_retrieval_p22_v1.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_retrieval_p22_v2.json > /dev/null
      - run: python -m json.tool server/tests/fixtures/persona_memory_recovery_p22_v1.json > /dev/null
  composed:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPRING_DATASOURCE_DRUID_PASSWORD: mia-ci-only
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://127.0.0.1:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      MIA_BEHAVIOR_SCRIPT: ${{ github.workspace }}/scripts/ci/verify_mia_behavior.py
      MIA_BEHAVIOR_DIR: /tmp/mia-behavior-ci
      MIA_EMBEDDING_DIR: /tmp/mia-behavior-model
      MIA_SCOPE_UPSTREAM: ${{ github.workspace }}/upstream
      MIA_BEHAVIOR_SUITE: ${{ inputs.suite || 'continuity' }}
      MIA_TEST_MODEL_OVERRIDE: ${{ inputs.test_model != 'configured' && inputs.test_model || '' }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mia-ci-only
          MYSQL_DATABASE: xiaozhi_esp32_server
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmia-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xinnan-tech/xiaozhi-esp32-server
          ref: 87c6df77b0220ddbd8fc804f984f83f69f3225e5
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: upstream/main/manager-api/pom.xml
      - name: Install existing manager client dependency for real Python Scope integration
        run: python -m pip install httpx==0.28.1 websockets==14.2 numpy==1.26.4 openai==2.8.1 tokenizers==0.21.1 onnxruntime==1.23.2
      - name: Install fixed upstream full-import dependencies only for actual app lifecycle
        if: inputs.suite == 'shutdown'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libsndfile1 ffmpeg
          dpkg-query --show libopus0 libsndfile1 ffmpeg > /tmp/mia-runtime-system.txt
          python -m pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r upstream/main/xiaozhi-server/requirements.txt
          python -m pip freeze > /tmp/mia-runtime-dependencies.txt
      - name: Prepare isolated TLS certificates and explicit test trust
        env:
          MIA_SCOPE_KEYSTORE: file:${{ runner.temp }}/mia-test-tls/server.p12
          MIA_SCOPE_CA: ${{ runner.temp }}/mia-test-tls/ca.pem
          MIA_TLS_CERT_FILE: ${{ runner.temp }}/mia-test-tls/server.pem
          MIA_TLS_KEY_FILE: ${{ runner.temp }}/mia-test-tls/server.key
        run: |
          mkdir -p "$RUNNER_TEMP/mia-test-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$RUNNER_TEMP/mia-test-tls/ca.key" -out "$MIA_SCOPE_CA" \
            -subj '/CN=Mia isolated test CA' -addext 'basicConstraints=critical,CA:TRUE' 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout "$MIA_TLS_KEY_FILE" \
            -out "$RUNNER_TEMP/mia-test-tls/server.csr" -subj '/CN=localhost' 2>/dev/null
          python - <<'PY'
          import certifi, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'mia-test-tls'
          with Path(os.environ['GITHUB_ENV']).open('a') as environment:
              for name in ['MIA_SCOPE_KEYSTORE', 'MIA_SCOPE_CA', 'MIA_TLS_CERT_FILE', 'MIA_TLS_KEY_FILE']:
                  environment.write(name + '=' + os.environ[name] + '\n')
          (root / 'server.ext').write_text('subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n')
          with Path(certifi.where()).open('ab') as trust:
              trust.write(b'\n' + Path(os.environ['MIA_SCOPE_CA']).read_bytes())
          PY
          openssl x509 -req -days 2 -in "$RUNNER_TEMP/mia-test-tls/server.csr" \
            -CA "$MIA_SCOPE_CA" -CAkey "$RUNNER_TEMP/mia-test-tls/ca.key" -CAcreateserial \
            -extfile "$RUNNER_TEMP/mia-test-tls/server.ext" -out "$MIA_TLS_CERT_FILE"
          openssl pkcs12 -export -out "$RUNNER_TEMP/mia-test-tls/server.p12" \
            -inkey "$MIA_TLS_KEY_FILE" -in "$MIA_TLS_CERT_FILE" -certfile "$MIA_SCOPE_CA" -passout pass:mia-ci-only
          sudo "$JAVA_HOME/bin/keytool" -importcert -noprompt -alias mia-isolated-ci \
            -file "$MIA_SCOPE_CA" -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
      - name: Prepare fixed public BGE assets without private data
        run: |
          if [ "${{ inputs.suite }}" != shutdown ]; then
            python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install transformers==4.51.3 numpy==1.26.4 onnx==1.17.0 onnxruntime==1.23.2 tokenizers==0.21.1 safetensors==0.5.3
          mia_export_python=python
          if [ "${{ inputs.suite }}" = shutdown ]; then
            python -m venv "$RUNNER_TEMP/mia-bge-export"
            mia_export_python="$RUNNER_TEMP/mia-bge-export/bin/python"
            "$mia_export_python" -m pip install pip==25.3 typing_extensions==4.16.0
            "$mia_export_python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            "$mia_export_python" -m pip install transformers==4.51.3 numpy==1.26.4 onnx==1.17.0 onnxruntime==1.23.2 tokenizers==0.21.1 safetensors==0.5.3
            "$mia_export_python" -m pip freeze > /tmp/mia-export-dependencies.txt
          fi
          "$mia_export_python" scripts/ci/prepare_mia_embedding.py --model BAAI/bge-base-zh-v1.5 --revision f03589ceff5aac7111bd60cfc7d497ca17ecac65 --output "$MIA_EMBEDDING_DIR"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['MIA_EMBEDDING_DIR'])
          metadata = json.loads((root / 'metadata.json').read_text())
          metadata['tokenizer_sha256'] = hashlib.sha256((root / 'tokenizer.json').read_bytes()).hexdigest()
          (root / 'metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY
          if [ "${{ inputs.suite }}" = shutdown ]; then
            python -m pip freeze > /tmp/mia-runtime-dependencies.txt
          fi
      - name: Reconstruct existing Mia and necessary binding patch
        id: prepare
        run: |
          mkdir -p "$RUNNER_TEMP/mia-binding-results"
          python -m server.companion.install_xiaozhi upstream --apply
          python -m server.companion.install_identity upstream --check > "$RUNNER_TEMP/mia-binding-results/binding.patch"
          python -m server.companion.install_identity upstream --apply
          git -C upstream apply --check "$GITHUB_WORKSPACE/server/companion/manager_tests/sensitive-data-expectation.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/server/companion/manager_tests/sensitive-data-expectation.patch"
          cp server/companion/manager_tests/MiaBehaviorIntegrationTest.java upstream/main/manager-api/src/test/java/xiaozhi/modules/device/
      - name: Three isolated actual-manager BGE and Provider rounds
        working-directory: upstream/main/manager-api
        env:
          MIA_TEST_LLM_API_KEY: ${{ secrets.MIA_TEST_LLM_API_KEY }}
          MIA_TEST_LLM_BASE_URL: ${{ secrets.MIA_TEST_LLM_BASE_URL }}
          MIA_TEST_LLM_MODEL: ${{ secrets.MIA_TEST_LLM_MODEL }}
        run: mvn --batch-mode -DskipTests=false -DfailIfNoTests=true -Dtest=MiaBehaviorIntegrationTest test
      - name: Preserve actual outputs and reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mia-composed-behavior-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/mia-behavior-ci
            /tmp/mia-runtime-dependencies.txt
            /tmp/mia-runtime-system.txt
            /tmp/mia-export-dependencies.txt
            upstream/main/manager-api/target/surefire-reports
          if-no-files-found: warn
