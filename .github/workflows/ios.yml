name: Build iOS App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build simulator app
        working-directory: ios
        run: |
          xcodebuild -project Mia.xcodeproj -scheme Mia -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mia-simulator" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime in devices.values()
                     for device in runtime if "iPhone" in device["name"]))
          ')
          xcodebuild -project Mia.xcodeproj -scheme Mia -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/mia-tests" \
            CODE_SIGNING_ALLOWED=NO test

      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild -project Mia.xcodeproj -scheme Mia -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/mia-device" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned artifacts
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mia-device/Build/Products/Release-iphoneos/Mia.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/mia-artifacts/Payload"
          cp -R "$app" "$RUNNER_TEMP/mia-artifacts/Payload/Mia.app"
          cd "$RUNNER_TEMP/mia-artifacts"
          zip -qr Mia-unsigned.ipa Payload
          shasum -a 256 Mia-unsigned.ipa > SHA256SUMS

      - name: Capture launch and home screens
        run: |
          set -euo pipefail
          simulator_ids=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [device for runtime in devices.values() for device in runtime
                    if "iPhone" in device["name"]]
          first = phones[0]
          alternates = [device for device in phones if device["name"] != first["name"]]
          second = next((device for device in alternates if "SE" in device["name"]), alternates[0])
          print(first["udid"], second["udid"])
          ')
          suffix=""
          for simulator_id in $simulator_ids; do
            xcrun simctl boot "$simulator_id" || true
            xcrun simctl bootstatus "$simulator_id" -b
            xcrun simctl install "$simulator_id" "$RUNNER_TEMP/mia-simulator/Build/Products/Debug-iphonesimulator/Mia.app"
            mia_record_log="$RUNNER_TEMP/mia-artifacts/mia-launch${suffix}.log"
            xcrun simctl io "$simulator_id" recordVideo --codec h264 --mask ignored \
              "$RUNNER_TEMP/mia-artifacts/mia-launch${suffix}.mp4" > "$mia_record_log" 2>&1 &
            mia_record_pid=$!
            trap 'kill -TERM "$mia_record_pid" 2>/dev/null || true; cat "$mia_record_log"' EXIT
            mia_record_deadline=$((SECONDS + 120))
            while true; do
              if ! kill -0 "$mia_record_pid" 2>/dev/null; then
                echo "Recorder exited before recording started for $simulator_id" >&2
                exit 1
              fi
              if grep -Fq "Recording started" "$mia_record_log"; then
                printf 'Observed "Recording started" for %s; launching Mia.\n' "$simulator_id"
                break
              fi
              if (( SECONDS >= mia_record_deadline )); then
                echo "Timed out after 120 seconds waiting for recording to start for $simulator_id" >&2
                exit 1
              fi
              sleep 0.1
            done
            xcrun simctl launch "$simulator_id" com.bboytang.mia
            sleep 8
            xcrun simctl io "$simulator_id" screenshot "$RUNNER_TEMP/mia-artifacts/mia-home${suffix}.png"
            kill -INT "$mia_record_pid"
            wait "$mia_record_pid"
            cat "$mia_record_log"
            trap - EXIT
            test -s "$RUNNER_TEMP/mia-artifacts/mia-launch${suffix}.mp4"
            xcrun simctl shutdown "$simulator_id"
            suffix="-secondary"
          done

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Mia-iOS-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mia-artifacts/Payload/Mia.app
            ${{ runner.temp }}/mia-artifacts/Mia-unsigned.ipa
            ${{ runner.temp }}/mia-artifacts/SHA256SUMS
            ${{ runner.temp }}/mia-artifacts/mia-home*.png
            ${{ runner.temp }}/mia-artifacts/mia-launch*.mp4
          if-no-files-found: error
