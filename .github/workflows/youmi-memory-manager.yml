name: Verify Youmi manager baseline
on:
  push:
    paths:
      - 'scripts/ci/verify_youmi_manager_baseline.py'
      - 'server/companion/**'
      - 'docs/verification/mia-persona-memory/manager-baseline-20261014.json'
      - '.github/workflows/youmi-memory-manager.yml'
  pull_request:
    paths:
      - 'scripts/ci/verify_youmi_manager_baseline.py'
      - 'server/companion/**'
      - 'docs/verification/mia-persona-memory/manager-baseline-20261014.json'
      - '.github/workflows/youmi-memory-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_DATASOURCE_DRUID_PASSWORD: youmi-ci-only
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://127.0.0.1:3306/youmi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: youmi-ci-only
          MYSQL_DATABASE: youmi_esp32_server
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pyoumi-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xinnan-tech/xiaozhi-esp32-server
          ref: 87c6df77b0220ddbd8fc804f984f83f69f3225e5
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: upstream/main/manager-api/pom.xml
      - name: Reconstruct existing Youmi manager patch on pinned source
        id: prepare
        run: |
          mkdir -p "$RUNNER_TEMP/mia-manager-results"
          python -m server.companion.install_youmi upstream --check > "$RUNNER_TEMP/mia-manager-results/current-companion.patch"
          python -m server.companion.install_youmi upstream --apply
          git -C upstream apply --check "$GITHUB_WORKSPACE/server/companion/manager_tests/sensitive-data-expectation.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/server/companion/manager_tests/sensitive-data-expectation.patch"
          java -version
          mvn --version
      - name: Compile and run existing real Java regressions
        working-directory: upstream/main/manager-api
        run: mvn --batch-mode -DskipTests=false -DfailIfNoTests=true package
      - name: Reproduce unsafe baseline with real HTTP, Shiro, MySQL and Redis
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          cp server/companion/manager_tests/YoumiIdentityBaselineTest.java upstream/main/manager-api/src/test/java/xiaozhi/modules/device/
          cd upstream/main/manager-api
          mvn --batch-mode -DskipTests=false -DfailIfNoTests=true -Dtest=YoumiIdentityBaselineTest test
      - name: Verify exact deployed class baseline
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          python scripts/ci/verify_youmi_manager_baseline.py \
            --classes upstream/main/manager-api/target/classes \
            --baseline docs/verification/mia-persona-memory/manager-baseline-20261014.json \
            --output "$RUNNER_TEMP/mia-manager-results/class-comparison.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Youmi-manager-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mia-manager-results
            upstream/main/manager-api/target/surefire-reports
          if-no-files-found: warn
