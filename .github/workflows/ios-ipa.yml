name: Publish standalone IPA

on:
  push:
    branches: [feature/mia-ios-bootstrap]
    paths: ['.github/workflows/ios-ipa.yml']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build iOS App run to distribute
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MIA_BUILD_RUN: ${{ inputs.build_run_id }}
    steps:
      - name: Publish only the verified IPA
        run: |
          set -euo pipefail
          [[ "$MIA_BUILD_RUN" =~ ^[0-9]+$ ]]
          youmi_sha=$(gh run view "$MIA_BUILD_RUN" --json headSha,headBranch,workflowName,status,conclusion \
            --jq 'select(.workflowName == "Build iOS App" and .headBranch == "feature/mia-ios-bootstrap" and .status == "completed" and .conclusion == "success").headSha')
          [[ "$youmi_sha" =~ ^[0-9a-f]{40}$ ]]
          youmi_tag="mia-ios-${youmi_sha:0:12}"
          # Workflow-modifying commits need an existing authorized tag for GITHUB_TOKEN releases.
          youmi_tag_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$youmi_tag" --jq '.object.sha')
          [[ "$youmi_tag_commit" == "$youmi_sha" ]]
          youmi_package="$RUNNER_TEMP/mia-package"
          youmi_artifact=$(gh api "repos/$GH_REPO/actions/runs/$MIA_BUILD_RUN/artifacts" --jq '.artifacts[].name' | python3 -c 'import sys; names=[s.strip() for s in sys.stdin]; print(next(n for n in names if n.startswith(("Youmi-iOS-unsigned-", "Mia-iOS-unsigned-"))))')
          gh run download "$MIA_BUILD_RUN" --name "$youmi_artifact" --dir "$youmi_package"
          mapfile -t youmi_ipas < <(find "$youmi_package" -type f \( -name Youmi-unsigned.ipa -o -name Mia-unsigned.ipa \))
          [[ "${#youmi_ipas[@]}" == 1 ]]
          cd "$(dirname "${youmi_ipas[0]}")"
          shasum -a 256 -c SHA256SUMS
          if [[ "${youmi_ipas[0]##*/}" != Youmi-unsigned.ipa ]]; then
            cp "${youmi_ipas[0]##*/}" Youmi-unsigned.ipa
          fi
          cat > "$RUNNER_TEMP/mia-release-notes.md" <<EOF
          未签名 Youmi IPA，需要自行重签，建议保持原签名与 Bundle ID 覆盖升级。
          重签工具必须保留并签名 PlugIns/YoumiActivity.appex，灵动岛扩展使用 com.bboytang.mia.activity。
          构建验证：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$MIA_BUILD_RUN
          声音快捷指令后台录音、锁屏停止时机、灵动岛与真机音频仍需安装后验证。
          EOF
          if ! gh release view "$youmi_tag" >/dev/null 2>&1; then
            gh release create "$youmi_tag" Youmi-unsigned.ipa --verify-tag --prerelease --latest=false \
              --title "Youmi iOS ${youmi_sha:0:7}" --notes-file "$RUNNER_TEMP/mia-release-notes.md"
          fi
          gh release download "$youmi_tag" --pattern Youmi-unsigned.ipa --dir "$RUNNER_TEMP/mia-download-check"
          cmp Youmi-unsigned.ipa "$RUNNER_TEMP/mia-download-check/Youmi-unsigned.ipa"
          printf 'IPA: %s/%s/releases/download/%s/Youmi-unsigned.ipa\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$youmi_tag" >> "$GITHUB_STEP_SUMMARY"
