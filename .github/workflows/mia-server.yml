name: Test Mia Protocol Server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/mia-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/mia-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libopus and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0
          python -m pip install -r server/requirements.txt
      - name: Test WebSocket and Opus protocol fixture
        run: |
          python -m unittest discover -s server/tests -v
          bash -n server/deploy/install-ubuntu.sh
          python -m py_compile server/deploy/check_wss.py
