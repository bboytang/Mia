name: Mia
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  Opus:
    url: https://github.com/sbooth/opus-binary-xcframework
    exactVersion: 0.3.0
  Ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    exactVersion: 0.1.3
targets:
  Mia:
    type: application
    platform: iOS
    sources:
      - MiaApp
    dependencies:
      - package: Opus
        product: opus
      - package: Ogg
        product: ogg
    info:
      path: MiaApp/Info.plist
      properties:
        CFBundleDisplayName: Mia
        NSMicrophoneUsageDescription: Mia 需要使用麦克风与你进行语音对话。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bboytang.mia
  MiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MiaTests
    dependencies:
      - target: Mia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bboytang.mia.tests
schemes:
  Mia:
    build:
      targets:
        Mia: all
        MiaTests: [test]
    test:
      targets:
        - MiaTests
