name: Youmi
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  Opus:
    url: https://github.com/sbooth/opus-binary-xcframework
    exactVersion: 0.3.0
  Ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    exactVersion: 0.1.3
targets:
  Youmi:
    type: application
    platform: iOS
    sources:
      - YoumiApp
      - YoumiShared
    dependencies:
      - target: YoumiActivity
      - package: Opus
        product: opus
      - package: Ogg
        product: ogg
    info:
      path: YoumiApp/Info.plist
      properties:
        CFBundleDisplayName: Youmi
        NSMicrophoneUsageDescription: Youmi 需要使用麦克风与你进行语音对话。
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.bboytang.mia
            CFBundleURLSchemes:
              - youmi
              - mia
        NSAppTransportSecurity:
          NSExceptionDomains:
            '43.143.230.174':
              NSExceptionAllowsInsecureHTTPLoads: true
            '127.0.0.1':
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen:
          UIColorName: YoumiLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bboytang.mia
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: YoumiApp/YoumiSimulator.entitlements
  YoumiActivity:
    type: app-extension
    platform: iOS
    sources:
      - YoumiActivity
      - YoumiShared
    info:
      path: YoumiActivity/Info.plist
      properties:
        CFBundleDisplayName: Youmi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bboytang.mia.activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) YOUMI_WIDGET_EXTENSION'
  YoumiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YoumiTests
    dependencies:
      - target: Youmi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bboytang.mia.tests
        GENERATE_INFOPLIST_FILE: YES
  YoumiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YoumiUITests
    dependencies:
      - target: Youmi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bboytang.mia.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Youmi:
    build:
      targets:
        Youmi: all
        YoumiTests: [test]
        YoumiUITests: [test]
    test:
      commandLineArguments:
        "-YoumiDisableAutomaticConversation": true
      targets:
        - YoumiTests
        - YoumiUITests
